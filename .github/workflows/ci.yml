name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Database tests
        run: ./scripts/test-db.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Server function checks
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check */index.ts
          deno test --allow-env _shared/

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY under
      # Settings → Secrets and variables → Actions. Without them the APK opens
      # on an "App is not configured" screen.
      - name: Build Android APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: aayamik-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
