name: Deploy web app

# Builds the Flutter web app and publishes it to Cloudflare Pages:
#   https://<project>.pages.dev/        the real app (your Supabase backend)
#   https://<project>.pages.dev/demo/   demo with sample listings, no backend
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN    Cloudflare → My Profile → API Tokens (Account · Cloudflare Pages · Edit)
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard → Workers & Pages → Account ID
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (already used by CI)

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: baaki-build
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Build real app
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build demo
        run: |
          flutter build web --release --dart-define=DEMO=true --base-href /demo/ -o ../web-demo
          mv ../web-demo build/web/demo

      - uses: actions/upload-artifact@v4
        with:
          name: baaki-build-web
          path: app/build/web

      - name: Publish to Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set yet; skipping publish. The built site is in the baaki-build-web artifact."
            exit 0
          fi
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy build/web --project-name="$PROJECT" --branch=main --commit-dirty=true
