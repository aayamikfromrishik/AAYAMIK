# Builds the website and uploads it to the Erichost account by FTP.
# Runs whenever the office computer sends new content (a push to main), or by hand from the Actions tab.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER     the FTP host from Erichost's cPanel, for example ftp.karukritdesigns.com
#   FTP_USERNAME   the FTP account's username
#   FTP_PASSWORD   the FTP account's password
# and optionally this repository variable:
#   FTP_DIR        the folder the site lives in on the server (default: public_html/)
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # photos are resized once and reused on later builds
      - uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ github.run_id }}
          restore-keys: media-

      - run: npm ci

      - run: npm run build

      - name: Upload to Erichost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          # only changed files are sent; the record of what is on the server is kept there
          state-name: .kd-ftp-sync-state.json
