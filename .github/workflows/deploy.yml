# Builds the website and uploads it to the Erichost account by FTP.
# Runs whenever the office computer sends new content (a push to main), or by hand from the Actions tab.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER     the FTP host from Erichost's cPanel, for example ftp.karukritdesigns.com
#   FTP_USERNAME   the FTP account's username
#   FTP_PASSWORD   the FTP account's password
#   QUIZ_SECRET    the key that signs client quiz links (the same key is in the Karukrit Work Desk)
# and optionally these repository variables:
#   FTP_DIR        the folder the site lives in on the server (default: public_html/)
#   QUIZ_URL       the Manus quiz address (default: content/quiz-link.txt, or "7 Quiz/quiz-link.txt" in the KD WEBSITE folder)
#   QUIZ_MODE      "redirect" to send clients straight to the quiz instead of showing it inside the page
#   SITE_MODE      "full" to open the whole site even while content/coming-soon.txt is there
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # photos are resized once and reused on later builds
      - uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ github.run_id }}
          restore-keys: media-

      - run: npm ci

      - run: npm run build
        env:
          QUIZ_SECRET: ${{ secrets.QUIZ_SECRET }}
          QUIZ_URL: ${{ vars.QUIZ_URL }}
          QUIZ_MODE: ${{ vars.QUIZ_MODE }}
          SITE_MODE: ${{ vars.SITE_MODE }}
          SITE_THEME: ${{ vars.SITE_THEME }}

      - name: Upload to Erichost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          # only changed files are sent; the record of what is on the server is kept there
          state-name: .kd-ftp-sync-state.json
